<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanser Admin Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f0ec; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #3d4a3e; border-bottom: 2px solid #3d4a3e; padding-bottom: 10px; }
        .stat-box { background: #3d4a3e; color: white; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: center;}
        .stat-box h2 { margin: 0; font-size: 36px; }
        .stat-box p { margin: 5px 0 0 0; font-size: 18px; opacity: 0.8; }
        button { background: #3d4a3e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 20px; font-size: 16px;}
        button:hover { background: #2c362d; }
        .loading { display: none; margin-top: 20px; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h1>Finanser Yönetim Paneli</h1>
    
    <button onclick="loadAdminStats()">Verileri Güncelle</button>
    <div id="loading" class="loading">Veriler Çekiliyor...</div>

    <div class="stat-box" id="usersBox" style="display: none;">
        <h2 id="totalUsers">0</h2>
        <p>Toplam Kayıtlı Kullanıcı</p>
    </div>

    <div class="stat-box" id="amountBox" style="display: none; background: #5c6e5d;">
        <h2 id="totalAmount">0.00 TL</h2>
        <p>Sistemde İşlenen Toplam Belge Tutarı</p>
    </div>
</div>

<script>
    const API_BASE_URL = ""; // Vercel adresi gelince buraya yazılacak

    async function loadAdminStats() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("usersBox").style.display = "none";
        document.getElementById("amountBox").style.display = "none";

        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/stats`);
            if (response.ok) {
                const data = await response.json();
                
                document.getElementById("totalUsers").textContent = data.total_users;
                document.getElementById("totalAmount").textContent = parseFloat(data.total_document_amount).toFixed(2) + " TL";
                
                document.getElementById("usersBox").style.display = "block";
                document.getElementById("amountBox").style.display = "block";
            } else {
                alert("Veriler çekilemedi.");
            }
        } catch (error) {
            console.error("Admin API Hatası:", error);
            alert("Sunucuya bağlanılamadı.");
        } finally {
            document.getElementById("loading").style.display = "none";
        }
    }

    // Sayfa açıldığında otomatik yükle
    window.onload = loadAdminStats;
</script>

</body>
</html>
